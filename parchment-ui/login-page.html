<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Parchment</title>
<link rel="icon" type="image/png" href="assets/parchment-logo.png">
<link rel="stylesheet" href="parchment-theme.css">
<link rel="stylesheet" href="login-page.css">
</head>
<body>


<main class="auth-page">
<button class="theme-toggle auth-theme" data-theme-toggle aria-label="Toggle theme"><span data-theme-icon>☾</span></button>
<div class="auth-split">
<section class="auth-art" aria-hidden="true">
<div class="orbit"></div><img class="hero-logo-float" src="assets/parchment-landing.png" alt=""><div class="feather">✦</div>
<i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
</section>
<section class="auth-panel">
<div class="auth-logo"><img src="assets/parchment-logo.png" alt="Parchment"></div>
<div class="eyebrow" style="text-align:center">Welcome back</div>
<h1>Welcome back</h1><p class="muted">Pick up where you left off.</p>
<form class="auth-form">
<div class="form-group"><label>Username</label><input required placeholder="Your username"></div>
<div class="form-group"><label>Password</label><input type="password" required placeholder="••••••••"></div>
<div class="actions"><button class="btn btn-primary" style="flex:1">Log in</button></div>
</form>
<p class="auth-foot small muted">New to Parchment? <a href="signup-page.html">Create an account</a></p>
</section>
</div></main>

<script src="parchment.js"></script>
<script src="login-page.js"></script>

</body></html>
