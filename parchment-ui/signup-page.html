<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signup — Parchment</title>
<link rel="icon" type="image/png" href="assets/parchment-logo.png">
<link rel="stylesheet" href="parchment-theme.css">
<link rel="stylesheet" href="signup-page.css">
</head>
<body>


<main class="auth-page">
<button class="theme-toggle auth-theme" data-theme-toggle aria-label="Toggle theme"><span data-theme-icon>☾</span></button>
<div class="auth-split">
<section class="auth-art" aria-hidden="true">
<div class="orbit"></div><img class="hero-logo-float" src="assets/parchment-landing.png" alt=""><div class="feather">✦</div>
<i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>
</section>
<section class="auth-panel">
<div class="auth-logo"><img src="assets/parchment-logo.png" alt="Parchment"></div>
<div class="eyebrow" style="text-align:center">Start studying</div>
<h1>Create your account</h1><p class="muted">Keep your courses, materials and review history together.</p>
<form class="auth-form">
<div class="form-group"><label>Username</label><input required placeholder="Choose a username"></div>
<div class="form-group"><label>Email address</label><input type="email" required placeholder="you@example.com"></div>
<div class="form-group"><label>Password</label><input id="pw" type="password" required></div>
<div class="form-group"><label>Confirm password</label><input id="pw2" type="password" required><span id="pw-help" class="small muted"></span></div>
<div class="actions"><button class="btn btn-primary" style="flex:1">Create account</button></div>
</form>
<p class="auth-foot small muted">Already have an account? <a href="login-page.html">Log in</a></p>
</section>
</div></main>

<script src="parchment.js"></script>
<script src="signup-page.js"></script>

</body></html>
