[project]
name = "parchment"
version = "0.1.0"
description = "Course-based study platform that turns notes into concept-organised flashcards."
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/sample_notes.py" = ["E501"]  # prose paragraphs

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "parchment.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:No directory at:UserWarning"]
