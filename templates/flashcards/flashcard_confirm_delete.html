{% extends "base.html" %}

{% block title %}Delete card · Parchment{% endblock %}

{% block content %}
  <h1>Delete this card?</h1>
  <p class="panel">{{ card.question|linebreaksbr }}</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="button danger">Delete card</button>
    <a href="{% url 'flashcards:list' card.course.pk %}">Cancel</a>
  </form>
{% endblock %}
