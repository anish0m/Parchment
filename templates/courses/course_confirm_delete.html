{% extends "base.html" %}

{% block title %}Delete {{ course.name }} · Parchment{% endblock %}

{% block content %}
  <h1>Delete “{{ course.name }}”?</h1>
  <p>This permanently deletes the course and everything in it. It can't be undone.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="button danger">Delete course</button>
    <a href="{{ course.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
