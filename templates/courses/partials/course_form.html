{% url 'courses:create' as create_url %}
<form id="course-form" class="form" method="post"
      action="{% if editing %}{% url 'courses:update' editing.pk %}{% else %}{{ create_url }}{% endif %}"
      hx-post="{% if editing %}{% url 'courses:update' editing.pk %}{% else %}{{ create_url }}{% endif %}"
      hx-target="this" hx-swap="outerHTML">
  {% csrf_token %}
  {{ form.as_div }}
  <div class="actions">
    <button type="submit" class="btn btn-primary">{% if editing %}Save changes{% else %}Create course{% endif %}</button>
    <button type="button" class="btn btn-ghost" data-close-modal="course-modal">Cancel</button>
  </div>
</form>
