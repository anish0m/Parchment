{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File too large · Parchment</title>
  <script src="{% static 'js/theme.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <main class="page-narrow">
    <section class="error-page">
      <p class="eyebrow error-code">Error 413</p>
      <h1 class="title-long">That file is too large</h1>
      <p class="lead">Uploads can be up to {{ limit_mb }} MB. Try a smaller PDF, or split it into parts.</p>
      <p class="actions" style="margin-top: 26px"><a class="btn btn-primary" href="/">Back to Parchment</a></p>
    </section>
  </main>
</body>
</html>
