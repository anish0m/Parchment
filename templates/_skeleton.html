{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Parchment{% endblock %}</title>
  <meta name="description" content="Parchment turns your notes and PDFs into concept-organised flashcards and schedules your reviews.">
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <script src="{% static 'js/theme.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js" defer
          integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js" defer
          integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb" crossorigin="anonymous"></script>
  <script src="{% static 'js/parchment.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
  {% include "partials/confirm_modal.html" %}
  <div class="toasts" data-toasts aria-live="polite" aria-label="Notifications"></div>
</body>
</html>
