{% load static %}
<header class="site-header">
  <nav class="nav" aria-label="Main">
    <a class="brand" href="{% if user.is_authenticated %}{% url 'courses:list' %}{% else %}{% url 'home' %}{% endif %}">
      <img src="{% static 'img/logo.png' %}" alt="" width="35" height="35"><span>Parchment</span>
    </a>
    <div class="nav-right">
      {% if user.is_authenticated %}
        <a class="nav-link" href="{% url 'courses:list' %}"{% if request.resolver_match.namespace == "courses" and request.resolver_match.url_name == "list" %} aria-current="page"{% endif %}>Courses</a>
        <div class="username">
          <button type="button" class="user-button" data-user-button aria-expanded="false" aria-haspopup="true">{{ user.get_username }} ▾</button>
          <div class="user-menu" data-user-menu>
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'courses:list' %}">All courses</a>
            <a href="{% url 'settings' %}">Settings</a>
            {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
            <hr>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="logout">Log out</button>
            </form>
          </div>
        </div>
      {% else %}
        <a class="nav-link" href="{% url 'login' %}">Log in</a>
        <a class="btn btn-primary btn-small" href="{% url 'signup' %}">Sign up</a>
      {% endif %}
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme"><span data-theme-icon aria-hidden="true">☾</span></button>
    </div>
  </nav>
</header>
