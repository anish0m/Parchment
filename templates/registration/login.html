{% extends "registration/_auth_page.html" %}

{% block title %}Log in · Parchment{% endblock %}
{% block heading %}Log in{% endblock %}

{% block body %}
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button">Log in</button>
  </form>
  <p class="muted"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
  <p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a></p>
{% endblock %}
