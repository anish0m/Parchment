{% extends "base.html" %}

{% block title %}Change password · Parchment{% endblock %}
{% block main_class %}page-narrow{% endblock %}

{% block content %}
  <a class="back" href="{% url 'profile' %}">← Profile</a>
  <div class="page-head">
    <div>
      <div class="eyebrow">Account</div>
      <h1 class="title-long">Change your password</h1>
    </div>
  </div>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_div }}
    <div class="actions">
      <button type="submit" class="btn btn-primary">Change password</button>
      <a class="btn btn-ghost" href="{% url 'profile' %}">Cancel</a>
    </div>
  </form>
{% endblock %}
