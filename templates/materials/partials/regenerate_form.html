<form method="post" action="{% url 'materials:regenerate' material.pk %}"
      {% if confirm %}data-confirm="Cards from this material that you haven't edited or studied will be replaced with new ones." data-confirm-title="Regenerate the cards?" data-confirm-button="Regenerate" data-confirm-style="primary"{% endif %}>
  {% csrf_token %}
  <button type="submit" class="btn {{ style|default:'btn-secondary' }}">{{ label }}</button>
</form>
