# Production: gunicorn + WhiteNoise, a background worker, PostgreSQL and backups.
#
#   cp .env.example .env    # then fill in the production values (see README)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Put a TLS-terminating reverse proxy (Caddy, nginx, a cloud load balancer) in
# front of port 8000; it must send X-Forwarded-Proto.

x-app: &app
  build:
    context: .
  image: parchment:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - media_data:/app/media
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parchment}
      POSTGRES_USER: ${POSTGRES_USER:-parchment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    <<: *app
    environment:
      DJANGO_SETTINGS_MODULE: parchment.settings.prod
      DJANGO_MEDIA_ROOT: /app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Text extraction and card generation. The embedding model needs about 1 GB.
  worker:
    <<: *app
    command: python manage.py qcluster
    environment:
      DJANGO_SETTINGS_MODULE: parchment.settings.prod
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_MIGRATE: "0"
      DJANGO_COLLECTSTATIC: "0"
    mem_limit: ${WORKER_MEMORY:-2g}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy  # the web container runs the migrations

  # Nightly database dump and uploads archive, kept for BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-parchment}
      PGUSER: ${POSTGRES_USER:-parchment}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - media_data:/media:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
