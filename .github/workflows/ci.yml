name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.15,<0.17"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parchment
          POSTGRES_USER: parchment
          POSTGRES_PASSWORD: parchment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parchment"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      DATABASE_URL: postgres://parchment:parchment@localhost:5432/parchment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Validate the OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - run: DJANGO_SETTINGS_MODULE=parchment.settings.prod python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_ALLOWED_HOSTS: example.com
      - run: pytest
