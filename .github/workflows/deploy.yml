name: Deploy

# Every push to the deployment branch updates the Hugging Face Space, which then
# rebuilds the Docker image and restarts. See "Free hosting" in the README.
on:
  push:
    branches: [deployment]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  huggingface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "huggingface_hub>=0.34,<2"
      - run: python .github/scripts/deploy_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_URL: ${{ secrets.EMAIL_URL }}
          DJANGO_DEFAULT_FROM_EMAIL: ${{ secrets.DJANGO_DEFAULT_FROM_EMAIL }}
